services:
  validator:
    image: "${DEADDROP_IMAGE:?use a registry reference with a sha256 digest}"
    platform: linux/amd64
    cpus: 2
    mem_limit: 1g
    command: ["serve", "--mode", "tdx"]
    environment:
      DEADDROP_RECIPIENT: "${DEADDROP_RECIPIENT:?set a native age X25519 recipient}"
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: /var/run/dstack.sock
        target: /var/run/dstack.sock
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
