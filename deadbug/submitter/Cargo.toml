[package]
name = "submitter"
version = "0.1.0"
edition = "2021"

[dependencies]
rust_omr = {path = "../rust_omr", version = "0.1.0"}
utils = {path = "../utils", version = "0.1.0"}
hex = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ethers = "2.0"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }